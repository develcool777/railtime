# Weekly update PRs: one for the workflow's actions, one per group of packages.
version: 2
updates:
  # The workflows, and the composite actions they share.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # The pnpm workspace, from its root lockfile.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Supply-chain guard, as pnpm's minimumReleaseAge: only versions public for a few days.
    cooldown:
      default-days: 3
    ignore:
      # Pinned to 6 by the override in pnpm-workspace.yaml, until vue-tsc supports TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      nuxt:
        patterns: ['nuxt', '@nuxt/*', 'vue', 'vue-*', 'tailwindcss']
      renderer:
        patterns: ['maplibre-gl', 'zod']
      lint-and-test:
        patterns: ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', 'vitest', '@vitest/*', 'prettier', 'knip', 'globals']
      types:
        patterns: ['typescript', '@types/*']
