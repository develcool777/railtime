# The checks every pull request must pass before it can merge into main. The Pages workflow runs
# them again on main before it deploys.
name: Checks

on:
  pull_request:
  workflow_call:

# A new push to a pull request cancels its stale run; a run for a deploy is never cancelled.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check
      - run: pnpm test-unit-ci
      - run: pnpm eslint-check
      - run: pnpm format-check
      - run: pnpm code-quality:dead-code
