name: Setup project
description: Install pnpm + Node, restore the dependency cache and install dependencies.

runs:
  using: composite
  steps:
    # Install pnpm first so setup-node can query the store path. Its version is the one `packageManager`
    # names in package.json, as everyone's: the action refuses a second.
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: pnpm

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
